<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stored Styles</title>
<style>
:root{
  --paper:#FAFAF8; --card:#FFFFFF; --ink:#14181F; --muted:#6B7280;
  --line:#E6E4DF; --brand:#0F4C9B; --tag:#B45309; --tag-bg:#FEF3E2;
  --shadow:0 1px 2px rgba(20,24,31,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:10px 14px 0;
  padding-top:calc(10px + env(safe-area-inset-top))}
.bar{display:flex;align-items:center;gap:10px}
.store{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1;
  display:flex;align-items:center;gap:7px}
.store select{border:0;background:none;font-weight:700;font-size:15px;padding:0}
.count{font-size:12px;font-weight:400;color:var(--muted)}
.sync{font-size:11px;font-weight:600;color:var(--brand)}
.sync.off{color:var(--tag)}
.mode{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.mode.on{background:var(--brand);border-color:var(--brand);color:#fff}
.search{width:100%;margin:10px 0 0;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);font-size:15px}
.search:focus{outline:2px solid var(--brand);outline-offset:-1px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

main{padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1;background:#F2F1ED;display:block;width:100%;
  border:0;padding:0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .miss{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#9CA3AF;padding:8px;text-align:center;line-height:1.4}
.loc{position:absolute;left:6px;bottom:6px;background:var(--tag-bg);color:var(--tag);
  border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}
.meta{padding:8px 10px 10px}
.sku{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:12.5px;font-weight:600;margin-top:5px}
.act{margin:0 10px 10px;border:1px solid var(--brand);background:var(--card);
  color:var(--brand);border-radius:8px;padding:7px;font-size:12.5px;font-weight:600;width:calc(100% - 20px)}
.act.rm{border-color:var(--line);color:var(--muted)}

.empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;
  padding:64px 24px;max-width:34ch;margin:0 auto}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,24,31,.55);
  display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-in{background:var(--paper);width:100%;max-height:92vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom))}
@media(min-width:560px){.sheet{align-items:center;justify-content:center}
  .sheet-in{max-width:420px;border-radius:16px}}
.sheet-in img{width:100%;aspect-ratio:1;object-fit:cover;display:block;
  border-radius:16px 16px 0 0;background:#F2F1ED}
.sheet-b{padding:16px 18px 0}
.sheet-b h2{margin:0;font-size:19px;letter-spacing:-.02em}
.sheet-b p{margin:5px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.rowline{display:flex;justify-content:space-between;font-size:14px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.rowline span:first-child{color:var(--muted)}
.close{margin:16px 18px 0;width:calc(100% - 36px);padding:12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="store">

      <span class="count" id="count"></span>

    </div>
    <button class="mode" id="mode">Staff</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Search SKU or name" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div></main>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>

const STORES = ["K2","K3","K4","K7"];
const COLS = {K2:5,K3:6,K4:7,K7:8};

let store = new URLSearchParams(location.search).get("store");
if(!STORES.includes(store)) store = STORES[0];
let staff = false, cat = "All", q = "";

/* stored[store][sku] = {loc, on} — mirrored from the sheet */
let stored = {}, syncing = false;
try{ stored = JSON.parse(localStorage.getItem("storedStyles")||"{}"); }catch(e){}
function cache(){ try{ localStorage.setItem("storedStyles",JSON.stringify(stored)); }catch(e){} }
function of(s){ return stored[s] || (stored[s]={}); }

function setSync(state){
  syncing = state==="busy";
  const n = el("sync");
  n.textContent = state==="busy" ? "Saving" : state==="off" ? "Offline" : "";
  n.hidden = !n.textContent;
  n.className = "sync" + (state==="off" ? " off" : "");
}

async function pull(){
  if(!API || API.indexOf("http")!==0) return;
  setSync("busy");
  try{
    const r = await fetch(API, {method:"GET"});
    const j = await r.json();
    if(j.ok){ stored = j.data || {}; cache(); setSync(""); render(); }
    else setSync("off");
  }catch(e){ setSync("off"); }
}

async function push(body){
  if(!API || API.indexOf("http")!==0){ cache(); return; }
  setSync("busy");
  try{
    /* text/plain keeps this a simple request — Apps Script cannot answer a CORS preflight */
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(body)});
    const j = await r.json();
    if(j.ok){ stored = j.data || {}; cache(); setSync(""); }
    else setSync("off");
  }catch(e){ setSync("off"); }
  render();
}

const CATS = ["All","Women","Men","Boy","Girl","Baby"];
const el = id => document.getElementById(id);

el("store").innerHTML = STORES.map(s=>`<option${s===store?" selected":""}>${s}</option>`).join("");
el("chips").innerHTML = CATS.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join("");

function inStore(r){ return r[COLS[store]] > 0; }
function photo(sku){ return PHOTO_BASE + sku + ".jpg"; }

function visible(){
  const map = of(store), needle = q.trim().toUpperCase();
  return DATA.filter(r=>{
    if(!inStore(r)) return false;
    if(!staff && !(r[0] in map)) return false;
    if(cat!=="All" && r[2]!==cat) return false;
    if(needle && !(r[0].toUpperCase().includes(needle) || r[1].toUpperCase().includes(needle))) return false;
    return true;
  });
}

function render(){
  const map = of(store), list = visible();
  el("count").textContent = staff
    ? list.length + " on hand"
    : Object.keys(map).filter(s=>{const r=DATA.find(x=>x[0]===s);return r&&inStore(r);}).length + " stored";
  [...document.querySelectorAll(".chip")].forEach(b=>b.classList.toggle("on",b.dataset.c===cat));
  el("mode").classList.toggle("on",staff);

  if(!list.length){
    el("grid").innerHTML="";
    el("empty").hidden=false;
    el("empty").innerHTML = q||cat!=="All"
      ? "<b>No match</b>Try a different search or category."
      : staff ? "<b>No stock in "+store+"</b>Switch store from the menu above."
              : "<b>Nothing stored yet</b>Tap Staff to mark the styles kept in the back room.";
    return;
  }
  el("empty").hidden=true;
  el("grid").innerHTML = list.map(r=>{
    const on = r[0] in map, loc = on ? map[r[0]].loc : "";
    return `<article class="tile">
      <button class="ph" data-sku="${r[0]}">
        <img src="${photo(r[0])}" alt="${r[1]}" loading="lazy"
             onerror="this.remove();this.parentNode.querySelector('.miss').hidden=false">
        <span class="miss" hidden>${r[0]}</span>
        ${loc?`<span class="loc">${loc}</span>`:""}
      </button>
      <div class="meta">
        <div class="sku">${r[0]}</div>
        <div class="desc">${r[1]}</div>
        <div class="price">RM ${r[4]}</div>
      </div>
      ${staff?`<button class="act ${on?"rm":""}" data-t="${r[0]}">${on?"Put back on display":"Store away"}</button>`:""}
    </article>`;
  }).join("");
}

function open(sku){
  const r = DATA.find(x=>x[0]===sku), map = of(store), rec = map[sku];
  el("sheetIn").innerHTML = `
    <img src="${photo(sku)}" alt="${r[1]}" onerror="this.style.visibility='hidden'">
    <div class="sheet-b">
      <h2>${sku}</h2><p>${r[1]}</p>
      <div style="margin-top:14px">
        <div class="rowline"><span>Price</span><span>RM ${r[4]}</span></div>
        <div class="rowline"><span>In ${store}</span><span>${r[COLS[store]]} pcs</span></div>
        <div class="rowline"><span>Other stores</span><span>${
          STORES.filter(s=>s!==store&&r[COLS[s]]>0).map(s=>s+" "+r[COLS[s]]).join("  ")||"None"}</span></div>
        ${rec?`<div class="rowline"><span>Kept at</span><span>${rec.loc||"\u2014"}</span></div>
        <div class="rowline"><span>Stored on</span><span>${rec.on||"\u2014"}</span></div>`:""}
      </div>
    </div>
    <button class="close">Close</button>`;
  el("sheet").classList.add("on");
}

el("sheet").onclick = e => { if(e.target.id==="sheet"||e.target.className==="close")
  el("sheet").classList.remove("on"); };
el("store").onchange = e => { store = e.target.value; render(); };
el("mode").onclick = () => { staff = !staff; render(); };
el("q").oninput = e => { q = e.target.value; render(); };
el("chips").onclick = e => { const b=e.target.closest(".chip"); if(b){cat=b.dataset.c; render();} };
el("grid").onclick = e => {
  const t = e.target.closest("[data-t]");
  if(t){
    if(syncing) return;
    const map = of(store), sku = t.dataset.t;
    if(sku in map){ delete map[sku]; render(); push({action:"remove",store:store,sku:sku}); }
    else{
      const loc = prompt("Where is it kept? (e.g. B3, Box 12)","");
      if(loc===null) return;
      map[sku] = {loc:loc, on:""}; render();
      push({action:"store",store:store,sku:sku,loc:loc,by:who()});
    }
    return;
  }
  const p = e.target.closest(".ph");
  if(p) open(p.dataset.sku);
};

function who(){
  let n = "";
  try{ n = localStorage.getItem("storedStylesWho")||""; }catch(e){}
  if(!n){
    n = prompt("Your name (recorded with each change)","") || "";
    try{ localStorage.setItem("storedStylesWho",n); }catch(e){}
  }
  return n;
}

render();
pull();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pull(); });
</script>
