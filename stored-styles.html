<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stored Styles</title>
<style>
:root{
  --paper:#FAFAF8; --card:#FFFFFF; --ink:#14181F; --muted:#6B7280;
  --line:#E6E4DF; --brand:#0F4C9B; --tag:#B45309; --tag-bg:#FEF3E2;
  --shadow:0 1px 2px rgba(20,24,31,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:10px 14px 0;
  padding-top:calc(10px + env(safe-area-inset-top))}
.bar{display:flex;align-items:center;gap:10px}
.store{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1;
  display:flex;align-items:center;gap:7px}
.store select{border:0;background:none;font-weight:700;font-size:15px;padding:0}
.count{font-size:12px;font-weight:400;color:var(--muted)}
.sync{font-size:11px;font-weight:600;color:var(--brand)}
.sync.off{color:var(--tag)}
.mode{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.mode.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stats{font-size:11px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
.stats b{color:var(--ink);font-weight:700}
.search{width:100%;margin:10px 0 0;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);font-size:15px}
.search:focus{outline:2px solid var(--brand);outline-offset:-1px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media(min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

main{padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.tile.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.ph{position:relative;aspect-ratio:1;background:#F2F1ED;display:block;width:100%;
  border:0;padding:0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph .miss{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#9CA3AF;padding:8px;text-align:center;line-height:1.4}
.miss[hidden]{display:none}
.kept{position:absolute;left:6px;bottom:6px;background:var(--tag-bg);color:var(--tag);
  border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}
.tick{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line);background:rgba(255,255,255,.92);display:flex;
  align-items:center;justify-content:center;font-size:15px;color:transparent}
.tile.sel .tick{background:var(--brand);border-color:var(--brand);color:#fff}
.meta{padding:8px 10px 10px}
.sku{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.panel{font-size:11.5px;color:var(--muted);margin-top:3px}

.empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;
  padding:64px 24px;max-width:34ch;margin:0 auto}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  display:none;gap:10px;align-items:center;box-shadow:0 -2px 10px rgba(20,24,31,.08)}
.tray.on{display:flex}
.tray .n{font-size:13.5px;font-weight:600;flex:1}
.tray .n small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
.tray button{border-radius:9px;padding:10px 14px;font-size:13.5px;font-weight:600;
  border:1px solid var(--brand);background:var(--brand);color:#fff}
.tray button.ghost{background:var(--card);color:var(--muted);border-color:var(--line)}
.tray button[disabled]{opacity:.5}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="store">
      <select id="store"></select>
      <span class="count" id="count"></span>
      <span class="sync" id="sync" hidden></span>
    </div>
    <span class="stats" id="stats" hidden></span>
    <button class="mode" id="mode">Staff</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Search SKU or name" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div></main>

<div class="tray" id="tray">
  <div class="n" id="trayN"></div>
  <button class="ghost" id="trayClear">Clear</button>
  <button id="trayGo">Store away</button>
</div>

const STORES = ["K2","K3","K4","K7"];
const COLS = {K2:5,K3:6,K4:7,K7:8};
const BLANK = "No panel";

let store = new URLSearchParams(location.search).get("store");
if(!STORES.includes(store)){ try{ store = localStorage.getItem("storedStylesStore"); }catch(e){} }
if(!STORES.includes(store)) store = STORES[0];
function rememberStore(){
  try{ localStorage.setItem("storedStylesStore",store); }catch(e){}
  try{ history.replaceState(null,"","?store="+store); }catch(e){}
}
rememberStore();
let staff = false, cat = "All", q = "";
let picked = new Set();

let stored = {}, syncing = false;
try{ stored = JSON.parse(localStorage.getItem("storedStyles")||"{}"); }catch(e){}
function cache(){ try{ localStorage.setItem("storedStyles",JSON.stringify(stored)); }catch(e){} }
function of(s){ return stored[s] || (stored[s]={}); }
const el = id => document.getElementById(id);

function setSync(state,msg){
  syncing = state==="busy";
  const n = el("sync");
  n.textContent = msg || (state==="busy" ? "Saving" : state==="off" ? "Offline" : "");
  n.hidden = !n.textContent;
  n.className = "sync" + (state==="off" ? " off" : "");
}

async function pull(){
  if(!API || API.indexOf("http")!==0) return;
  setSync("busy");
  try{
    const r = await fetch(API,{method:"GET"});
    const j = await r.json();
    if(j.ok){ stored = j.data || {}; cache(); setSync(""); render(); }
    else setSync("off");
  }catch(e){ setSync("off"); }
}

async function send(body){
  if(!API || API.indexOf("http")!==0){ cache(); return true; }
  try{
    const r = await fetch(API,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
    const j = await r.json();
    if(j.ok){ stored = j.data || {}; cache(); return true; }
  }catch(e){}
  return false;
}

/* panel of a row for the current store */
function panelOf(r){ return (store==="K3" ? r[3] : r[2]) || BLANK; }
function inStore(r){ return r[COLS[store]] > 0; }
function photo(sku){ return PHOTO_BASE + sku + ".jpg"; }

function panels(){
  const set = new Set();
  DATA.forEach(r=>{ if(inStore(r)) set.add(panelOf(r)); });
  const list = [...set].filter(p=>p!==BLANK).sort();
  if(set.has(BLANK)) list.push(BLANK);
  return ["All", ...list];
}

function visible(){
  const map = of(store), needle = q.trim().toUpperCase();
  return DATA.filter(r=>{
    if(!inStore(r)) return false;
    if(!staff && !(r[0] in map)) return false;
    if(cat!=="All" && panelOf(r)!==cat) return false;
    if(needle && !(r[0].toUpperCase().includes(needle) || r[1].toUpperCase().includes(needle))) return false;
    return true;
  });
}

function renderChips(){
  const list = panels();
  if(!list.includes(cat)) cat = "All";
  el("chips").innerHTML = list.map(c=>
    `<button class="chip${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("");
}

function render(){
  const map = of(store), list = visible();
  renderChips();
  el("count").textContent = staff
    ? list.length + " on hand"
    : Object.keys(map).filter(s=>{const r=DATA.find(x=>x[0]===s);return r&&inStore(r);}).length + " stored";
  el("mode").classList.toggle("on",staff);
  el("store").disabled = staff;
  el("mode").textContent = staff ? "Exit staff" : "Staff";

  if(!list.length){
    el("grid").innerHTML="";
    el("empty").hidden=false;
    el("empty").innerHTML = q||cat!=="All"
      ? "<b>No match</b>Try a different search or panel."
      : staff ? "<b>No stock in "+store+"</b>Switch store from the menu above."
              : "<b>Nothing stored yet</b>Tap Staff to mark the styles kept in the back room.";
    updateTray(); return;
  }
  el("empty").hidden=true;
  el("grid").innerHTML = list.map(r=>{
    const on = r[0] in map, sel = picked.has(r[0]);
    return `<article class="tile${sel?" sel":""}" data-sku="${r[0]}">
      <div class="ph">
        <img src="${photo(r[0])}" alt="${r[0]}" loading="lazy"
             onerror="this.remove();this.parentNode.querySelector('.miss').hidden=false">
        <span class="miss" hidden>${r[0]}</span>
        ${on?`<span class="kept">Stored</span>`:""}
        ${staff?`<span class="tick">&#10003;</span>`:""}
      </div>
      <div class="meta">
        <div class="sku">${r[0]}</div>
        <div class="panel">${panelOf(r)}</div>
      </div>
    </article>`;
  }).join("");
  updateTray();
}

function updateTray(){
  const map = of(store);
  const n = picked.size;
  el("tray").classList.toggle("on", staff && n>0);
  if(!n) return;
  const putBack = [...picked].filter(s=>s in map).length;
  const away = n - putBack;
  el("trayN").innerHTML = n + " selected<small>" +
    (away?away+" to store away":"") + (away&&putBack?" · ":"") +
    (putBack?putBack+" to put back":"") + "</small>";
  el("trayGo").textContent = (away ? "Store away" : "Put back") + " · " + store;
}

function who(){
  let n = "";
  try{ n = localStorage.getItem("storedStylesWho")||""; }catch(e){}
  if(!n){
    n = (prompt("Your name","")||"").trim();
    if(!n) return "";
    try{ localStorage.setItem("storedStylesWho",n); }catch(e){}
  }
  return n;
}

async function apply(){
  const name = who();
  if(!name) return;
  const map = of(store), list = [...picked];
  const away = list.filter(s=>!(s in map)).length, back = list.length - away;
  const msg = [away?away+" to store away":"", back?back+" to put back":""].filter(Boolean).join(", ");
  if(!confirm("Save to " + store + "?\n\n" + msg + "\nStaff: " + name)) return;
  el("trayGo").disabled = true;
  let done = 0, failed = 0;
  for(const sku of list){
    setSync("busy","Saving "+(++done)+"/"+list.length);
    const ok = (sku in map)
      ? await send({action:"remove",store:store,sku:sku})
      : await send({action:"store",store:store,sku:sku,loc:"",by:name});
    if(!ok) failed++;
  }
  el("trayGo").disabled = false;
  picked.clear();
  setSync(failed?"off":"", failed?failed+" failed":"");
  if(!failed) setTimeout(()=>setSync(""),1200);
  render();
}

el("store").innerHTML = STORES.map(s=>`<option${s===store?" selected":""}>${s}</option>`).join("");
el("store").onchange = e => { store = e.target.value; rememberStore(); picked.clear(); render(); };
el("mode").onclick = () => {
  if(!staff && STAFF_PIN){
    const p = prompt("Staff password","");
    if(p !== STAFF_PIN){ if(p!==null) alert("Wrong password"); return; }
  }
  staff = !staff; picked.clear(); render();
  if(staff){ logVisit("staff"); loadStats(); } else el("stats").hidden = true;
};
el("q").oninput = e => { q = e.target.value; render(); };
el("chips").onclick = e => { const b=e.target.closest(".chip"); if(b){cat=b.dataset.c; render();} };
el("grid").onclick = e => {
  if(!staff) return;
  const t = e.target.closest(".tile"); if(!t) return;
  const sku = t.dataset.sku;
  if(picked.has(sku)) picked.delete(sku); else picked.add(sku);
  t.classList.toggle("sel", picked.has(sku));
  updateTray();
};
el("trayClear").onclick = () => { picked.clear(); render(); };
el("trayGo").onclick = () => { if(!syncing) apply(); };

function device(){
  let d = "";
  try{ d = localStorage.getItem("storedStylesDevice")||""; }catch(e){}
  if(!d){
    d = Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem("storedStylesDevice",d); }catch(e){}
  }
  return d;
}
function logVisit(mode){
  if(!API || API.indexOf("http")!==0) return;
  const key = "storedStylesLogged:" + mode;
  try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key,"1"); }catch(e){}
  let name = "";
  try{ name = localStorage.getItem("storedStylesWho")||""; }catch(e){}
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"visit",store:store,device:device(),mode:mode,by:name,
      ua:/Mobi|Android|iPhone/i.test(navigator.userAgent)?"Phone":"Computer"})}).catch(()=>{});
}

async function loadStats(){
  if(!API || API.indexOf("http")!==0) return;
  const n = el("stats");
  n.hidden = false; n.textContent = "…";
  try{
    const r = await fetch(API + "?stats=1");
    const j = await r.json();
    if(!j.ok || !staff){ n.hidden = true; return; }
    const s = j.stats, here = (s.todayByStore||{})[store] || 0;
    n.innerHTML = "Users today <b>" + s.today + "</b> (" + store + " " + here + ")<br>7 days <b>" +
                  s.week + "</b> · total <b>" + s.all + "</b>";
  }catch(e){ n.hidden = true; }
}

render();
pull();
logVisit("view");
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !syncing) pull(); });
</script>
</body>
